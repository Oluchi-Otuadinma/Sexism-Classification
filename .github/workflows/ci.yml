name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        env:
          HF_TOKEN: test-token-not-real
          HF_MODEL: test/model
          INFERENCE_BACKEND: local
          PRELOAD_MODEL: false  # tests must not download real model weights
        run: |
          pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t sexism-classifier:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name sexism-ci -p 8000:8000 \
            -e PRELOAD_MODEL=false \
            -e INFERENCE_BACKEND=local \
            sexism-classifier:ci
          sleep 8
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"healthy"'
