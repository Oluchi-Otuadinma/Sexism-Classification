name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        env:
          HF_API_KEY: test-key-not-real
          HF_MODEL: test/model
          INFERENCE_BACKEND: local
          PRELOAD_MODEL: false  # tests must not download real model weights
        run: |
          pytest tests/ -v
